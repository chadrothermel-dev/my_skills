name: Pack Skill Zips

on:
  push:
    branches: [main]
    paths:
      - "skills/**"
      - "tools/pack_zips.py"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pack-skill-zips-${{ github.ref }}
  cancel-in-progress: false

jobs:
  pack:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Rebuild deterministic skill zips
        run: python tools/pack_zips.py --clean

      - name: Commit updated zips if changed
        run: |
          if git status --porcelain dist/ | grep -q .; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add dist/
            git commit -m "chore(dist): rebuild skill zips [skip ci]"
            git push
          else
            echo "Skill zips are already up to date."
          fi
